<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1311" />
    <meta name="description" content="A clearer view of every expense. Review policy flags, employee claims, and input issues in one place." />
    <script>
      try {
        const dark = localStorage.getItem("expense-theme") !== "light";
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0f1311" : "#f3f5f2";
      } catch {}
    </script>
    <title>ExpenseCheck — Expense Policy Checker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
